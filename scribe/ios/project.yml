# Electron for iPad and iPhone (with Scribe embedded).
# Generated with `xcodegen generate` — edit this file, not Electron.xcodeproj.
# Shares the format/bridge Swift files with the Mac app (../macos/Scribe/Core)
# and syncs through a folder in iCloud Drive that you choose on first launch.

name: Electron
options:
  bundleIdPrefix: app.electron
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

# Native LaTeX for Electron's notes.
packages:
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    exactVersion: 1.7.3

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Electron:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Scribe
      - path: Electron
      - path: Shared
      - path: Resources
        buildPhase: resources
      - path: ../macos/Scribe/Core/Core.swift
      - path: ../macos/Scribe/Core/Model.swift
      - path: ../macos/Scribe/Core/Tools.swift
      - path: ../macos/Scribe/Page/PDFBackground.swift
      - path: ../macos/Scribe/Core/Thumbnails.swift
      - path: ../macos/Scribe/Views/PageGrid.swift
      - path: ../macos/Scribe/Views/Library.swift
      - path: ../macos/Scribe/App/InkReader.swift
      - path: ../macos/Scribe/Core/PDFImportJob.swift
      - path: ../macos/Scribe/Views/ImportPopup.swift
    dependencies:
      - package: SwiftMath
      - target: ElectronWidgets
        embed: true
    info:
      path: Config/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: app.electron.ios.pairing
            CFBundleURLSchemes: [onyx, electron]
        NSAppTransportSecurity:
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    preBuildScripts:
      - name: Build the Rust core
        basedOnDependencyAnalysis: false
        script: bash "$SRCROOT/build-core.sh"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.electron.ios
        PRODUCT_NAME: Electron
        CODE_SIGN_ENTITLEMENTS: Config/Electron.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: C63K728GC6
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Electron
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "The camera reads the pairing code your Mac shows, so the Agent can reach it."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../macos/CScribeCore
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(SRCROOT)/../target/aarch64-apple-ios/release
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(SRCROOT)/../target/aarch64-apple-ios-sim/release

  ElectronWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Electron Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.electron.ios.widgets
        PRODUCT_NAME: ElectronWidgets
        CODE_SIGN_ENTITLEMENTS: Widgets/ElectronWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: C63K728GC6
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Electron Widgets
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

schemes:
  Electron:
    build:
      targets:
        Electron: all
        ElectronWidgets: all
    run:
      config: Debug
