    <path d="M382 256 C382 325.6 325.6 382 256 382 C186.4 382 130 325.6 130 256 C130 186.4 186.4 130 256 130" fill="none" stroke="#7A89FF" stroke-opacity="0.42" stroke-width="13" stroke-linecap="round"/>
    <path d="M256 436 C156.6 436 76 355.4 76 256 C76 156.6 156.6 76 256 76 C355.4 76 436 156.6 436 256" fill="none" stroke="#4BC3F7" stroke-opacity="0.30" stroke-width="13" stroke-linecap="round"/>

    <circle cx="256" cy="256" r="30" fill="url(#nuc)"/>
    <circle cx="256" cy="184" r="17" fill="#4BC3F7"/>
