<!-- Full-bleed square iOS AppIcon for Electron in Stratus pitch-black obsidian style. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Electron iOS</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B10"/>
      <stop offset="0.55" stop-color="#030305"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.56" cy="0.38" r="0.58">
