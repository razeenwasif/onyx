<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Electron</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B10"/>
      <stop offset="0.55" stop-color="#030305"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.56" cy="0.40" r="0.55">
      <stop offset="0" stop-color="#7A89FF" stop-opacity="0.26"/>
      <stop offset="0.6" stop-color="#4BC3F7" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="nuc" cx="0.4" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#A5B0FF"/>
      <stop offset="1" stop-color="#7A89FF"/>
    </radialGradient>
  </defs>

  <!-- Stratus pitch-black obsidian tile -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#glow)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#sheen)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2.5"/>

  <!-- Open shells: three 270° orbit trails in Stratus indigo/sky -->
  <path d="M256 184 C295.8 184 328 216.2 328 256 C328 295.8 295.8 328 256 328 C216.2 328 184 295.8 184 256" fill="none" stroke="#7A89FF" stroke-opacity="0.52" stroke-width="13" stroke-linecap="round"/>
  <path d="M382 256 C382 325.6 325.6 382 256 382 C186.4 382 130 325.6 130 256 C130 186.4 186.4 130 256 130" fill="none" stroke="#7A89FF" stroke-opacity="0.40" stroke-width="13" stroke-linecap="round"/>
  <path d="M256 436 C156.6 436 76 355.4 76 256 C76 156.6 156.6 76 256 76 C355.4 76 436 156.6 436 256" fill="none" stroke="#4BC3F7" stroke-opacity="0.28" stroke-width="13" stroke-linecap="round"/>

  <!-- Nucleus -->
  <circle cx="256" cy="256" r="30" fill="url(#nuc)"/>

  <!-- Electrons in the Stratus palette -->
  <circle cx="256" cy="184" r="17" fill="#4BC3F7"/>
  <circle cx="382" cy="256" r="17" fill="#34D399"/>
  <circle cx="256" cy="130" r="17" fill="#E88255"/>
  <circle cx="256" cy="436" r="17" fill="#A78BFA"/>
  <circle cx="436" cy="256" r="17" fill="#FBBF24"/>
</svg>
