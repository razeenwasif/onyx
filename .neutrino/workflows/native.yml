# onyx's .github/workflows/ci.yml Scribe job, on Neutrino.
#
# Scribe needs macOS (Swift, a real window for the click test), so it runs on
# Kagutsuchi itself (runs-on: host). Changes from the GitHub version:
#   * it runs on pushes and pull requests that touch Scribe, the Electron app
#     it embeds into, or this file, plus version tags and by hand
#     (ntr run start native -b main); GitHub ran it on every push
#   * Node 22, as on GitHub: atlas's default Node (26) comes with an npm that
#     skips install scripts until approved, so Electron never downloaded its
#     binary. The Node steps put Homebrew's node@22 first on their PATH.
#   * rust-cache is gone: host jobs start from a fresh checkout

name: native

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ["scribe/**", "desktop/**", ".neutrino/workflows/native.yml"]
  pull_request: { paths: ["scribe/**", "desktop/**", ".neutrino/workflows/native.yml"] }
  workflow_dispatch: {}

jobs:
  scribe:
    name: Scribe (Rust, Swift, app, embed, click test)
    runs-on: host
    timeout-minutes: 60
    steps:
      - name: Rust core tests
        working-directory: scribe
        run: cargo test -p scribe-core
      - name: Swift tests
        working-directory: scribe
        run: |
          cargo build --release -p scribe-core
          MACOSX_DEPLOYMENT_TARGET=15.0 swift test
      - name: Standalone app builds
        working-directory: scribe
        run: ./build.sh
      - name: Embed Scribe in Electron
        working-directory: desktop
        run: |
          export PATH="/opt/homebrew/opt/node@22/bin:$PATH"
          npm ci
          npm run build:scribe
      # Real mouse events into a window set up like the app's: clicks must
      # reach Electron while Scribe is hidden, and Scribe while it shows.
      - name: Click test
        working-directory: desktop
        run: |
          export PATH="/opt/homebrew/opt/node@22/bin:$PATH"
          npm run test:clicks
